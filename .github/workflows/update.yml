name: Atualizar concursos

on:
  workflow_dispatch: {}
  # Automação diária (fase 2) — descomentar quando estiver validado:
  # schedule:
  #   - cron: "0 9 * * *"   # 09:00 UTC = 06:00 America/Recife

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r scraper/requirements.txt

      - name: Rodar scraper
        run: python scraper/main.py

      - name: Copiar dados para o site
        run: cp data/concursos.json docs/data/concursos.json

      - name: Commit se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/concursos.json docs/data/concursos.json
          git diff --cached --quiet || git commit -m "Atualização automática de concursos $(date -u +%Y-%m-%d)"
          git push
